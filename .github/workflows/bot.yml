name: VN30 Quant Scanner

on:
  schedule:
    - cron: '27 9 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests mplfinance ipython tenacity pydantic beautifulsoup4 pytz openpyxl
          echo "import sys; from unittest.mock import MagicMock; sys.modules['vnai'] = MagicMock()" > src/vnai.py

      - name: Fetch Market Data
        run: |
          rm -rf data/*.csv
          PYTHONPATH=.:src python -c "
          import sys
          from unittest.mock import MagicMock
          sys.modules.setdefault('vnstock_ezchart', MagicMock())
          sys.modules.setdefault('vnstock_chart', MagicMock())
          from vnstock.explorer.vci import quote as vci_quote
          print('vci_quote attrs:', [x for x in dir(vci_quote) if not x.startswith('_')])
          from vnstock.core import registry
          print('registry attrs:', [x for x in dir(registry) if not x.startswith('_')])
          "
          PYTHONPATH=.:src python src/fetch_vn30.py || true
      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py