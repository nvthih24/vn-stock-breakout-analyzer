name: VN30 Quant Scanner

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests mplfinance ipython tenacity pydantic beautifulsoup4 pytz openpyxl
          pip install --no-deps git+https://github.com/thinh-vu/vnstock.git
          echo "import sys; from unittest.mock import MagicMock; sys.modules['vnai'] = MagicMock()" > src/vnai.py

      - name: Fetch Market Data
        run: python src/fetch_vn30.py

      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py