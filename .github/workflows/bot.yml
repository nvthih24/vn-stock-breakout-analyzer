name: VN30 Quant Scanner

on:
  schedule:
    # Chạy vào 08:15 UTC (Tương đương 15:15 giờ Việt Nam), từ Thứ 2 đến Thứ 6
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Fetch Market Data
        run: python src/fetch_vn30.py

      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py