name: VN30 Quant Scanner

on:
  schedule:
    - cron: '27 9 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests mplfinance ipython tenacity pydantic beautifulsoup4 pytz openpyxl
          echo "import sys; from unittest.mock import MagicMock; sys.modules['vnai'] = MagicMock()" > src/vnai.py

      - name: Set VN date
        run: echo "RUN_DATE=$(TZ='Asia/Ho_Chi_Minh' date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Cache VN30 market data
        uses: actions/cache@v4
        with:
          path: data
          key: vn30-data-${{ runner.os }}-${{ env.RUN_DATE }}-fresh1
          restore-keys: |
            vn30-data-${{ runner.os }}-

      - name: Fetch Market Data
        run: |
          python -c "
          import requests
          from datetime import datetime

          url = 'https://trading.vietcap.com.vn/api/chart/OHLCChart/gap-chart'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json',
              'Origin': 'https://trading.vietcap.com.vn',
              'Referer': 'https://trading.vietcap.com.vn/',
          }
          payload = {
              'timeFrame': 'ONE_DAY',
              'symbols': ['ACB'],
              'to': int(datetime.now().replace(hour=23, minute=59, second=59).timestamp()),
              'countBack': 750,
          }
          r = requests.post(url, json=payload, headers=headers, timeout=20)
          print('Status:', r.status_code)
          print('Body:', r.text[:500])
          "

      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=.:src python src/scanner.py