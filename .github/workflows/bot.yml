name: VN30 Quant Scanner

on:
  schedule:
    - cron: '27 9 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests mplfinance ipython tenacity pydantic beautifulsoup4 pytz openpyxl
          echo "import sys; from unittest.mock import MagicMock; sys.modules['vnai'] = MagicMock()" > src/vnai.py

      - name: Fetch Market Data
        run: |
          rm -rf data/*.csv
          PYTHONPATH=. python src/fetch_vn30.py
          PYTHONPATH=. python -c "import os, vnstock; root = os.path.dirname(vnstock.__file__); print('path:', root); [print(r, dirs, [f for f in files if f.endswith('.py')]) for r, dirs, files in os.walk(root) if os.path.relpath(r, root).count(os.sep) <= 2]"
      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py