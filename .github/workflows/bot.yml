name: VN30 Quant Scanner

on:
  schedule:
    - cron: '27 9 * * 1-5'
  workflow_dispatch: # Cho phép bạn bấm chạy thủ công bằng tay trên Web

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests mplfinance ipython tenacity pydantic beautifulsoup4 pytz openpyxl
          echo "import sys; from unittest.mock import MagicMock; sys.modules['vnai'] = MagicMock()" > src/vnai.py

      - name: Fetch Market Data
        run: |
          rm -rf data/*.csv
          PYTHONPATH=.:src python -c "
          import sys
          from unittest.mock import MagicMock
          sys.modules.setdefault('vnstock_ezchart', MagicMock())
          sys.modules.setdefault('vnstock_chart', MagicMock())

          from vnstock.explorer.vci.quote import Quote as VCIQuote
          q = VCIQuote(symbol='ACB')
          print('methods:', [m for m in dir(q) if 'hist' in m or 'quote' in m or not m.startswith('_')])
          df = q.history(start='2024-01-01', end='2026-11-22', interval='1D')
          print('type:', type(df), 'empty:', getattr(df, 'empty', None))
          if df is not None and not getattr(df, 'empty', True):
            print(df.tail(2))
          "
        # PYTHONPATH=.:src python src/fetch_vn30.py

          
      - name: Scan & Send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py